plugins {
    id 'java'
}

group = 'com.rykun'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation files('libs/HytaleServer.jar')
    implementation 'com.google.code.gson:gson:2.11.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
